<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quizline — Live trivia vs friends, bots, and randoms</title>
    <meta
      name="description"
      content="Play Quizline, a timed trivia game. 10 questions, Bullet Blitz or Rapid pace, live 1v1, party lobbies, and ranked randoms across science, history, math, sports, and more."
    />
    <meta
      name="keywords"
      content="trivia, quiz, live trivia, multiplayer quiz, Quizline, ranked trivia, general knowledge, science quiz, history quiz"
    />
    <meta name="author" content="Quizline" />
    <meta name="robots" content="index,follow" />
    <meta name="theme-color" content="#ff2d6a" />
    <meta name="color-scheme" content="dark light" />
    <link rel="canonical" href="https://quizline-ebon.vercel.app/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Quizline" />
    <meta property="og:title" content="Quizline — Live trivia vs friends, bots, and randoms" />
    <meta
      property="og:description"
      content="Timed trivia with live 1v1, party play, and ranked random matchmaking. Faster answers and consecutive streaks score more."
    />
    <meta property="og:url" content="https://quizline-ebon.vercel.app/" />
    <meta property="og:image" content="https://quizline-ebon.vercel.app/favicon.svg" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Quizline — Live trivia" />
    <meta
      name="twitter:description"
      content="Play timed trivia against friends, bots, or a random ranked opponent."
    />
    <meta name="twitter:image" content="https://quizline-ebon.vercel.app/favicon.svg" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Quizline",
        "url": "https://quizline-ebon.vercel.app/",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Web",
        "description": "Timed live trivia with bots, friends, party lobbies, and ranked random matchmaking.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4840853197505040"
      crossorigin="anonymous"
    ></script>
    <script>
      try {
        var saved = localStorage.getItem('quizline-theme')
        var theme =
          saved === 'dark' || saved === 'light'
            ? saved
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        document.documentElement.dataset.theme = theme
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <main>
        <h1>Quizline</h1>
        <p>
          Quizline is a free timed trivia game in your browser. Play 10 questions in Bullet, Blitz, or Rapid pace.
          Challenge a friend live, host a party, or queue for a ranked random opponent.
        </p>
        <p>
          Topics include Daily Mix, General Knowledge, Science, History, Pop Culture, Math, Geography, Sports, and Flags.
        </p>
        <p>Enable JavaScript to play at <a href="https://quizline-ebon.vercel.app/">quizline-ebon.vercel.app</a>.</p>
      </main>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
